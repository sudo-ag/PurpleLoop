[project]
name = "purpleloop"
version = "0.1.0"
dependencies = [
    "ollama",
    "fastapi",
    "uvicorn",
    "jinja2",
    "pytest",
    "requests",
]

[project.scripts]
start  = "python -m src.ops start"
status = "python -m src.ops status"
report = "python -m src.ops report"
watch  = "python -m src.ops watch"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
]
