<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PurpleLoop War Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .feed { height: calc(100vh - 120px); overflow-y: auto; }
        .message { margin-bottom: 0.75rem; padding: 0.75rem; border-radius: 0.5rem; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .red-msg { background-color: #fee2e2; color: #991b1b; border-left: 4px solid #ef4444; }
        .blue-msg { background-color: #dbeafe; color: #1e40af; border-left: 4px solid #3b82f6; }
        .log-msg { background-color: #1e293b; color: #f8fafc; font-family: 'Courier New', Courier, monospace; white-space: pre-wrap; border-left: 4px solid #64748b; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900">
    <div class="flex flex-col h-screen">
        <header class="bg-gray-800 text-white p-4 flex justify-between items-center shadow-md">
            <h1 class="text-2xl font-bold tracking-tight">PurpleLoop War Room</h1>
            <div id="status-bar" class="text-lg font-medium bg-gray-700 px-4 py-2 rounded-full">
                Turn: <span id="turn-count" class="font-mono">0</span> | Winner: <span id="winner" class="font-bold text-yellow-400">None</span>
            </div>
        </header>
        <div class="flex flex-1 overflow-hidden p-4 gap-4">
            <!-- Red Agent Feed -->
            <div class="w-1/4 flex flex-col">
                <h2 class="text-center font-bold mb-3 text-red-700 uppercase tracking-wider text-sm">Red Agent</h2>
                <div id="red-feed" class="feed bg-white border border-gray-300 p-4 rounded-lg shadow-inner"></div>
            </div>
            <!-- Battle Log -->
            <div class="w-2/4 flex flex-col">
                <h2 class="text-center font-bold mb-3 text-gray-700 uppercase tracking-wider text-sm">Battle Log</h2>
                <div id="battle-log" class="feed bg-gray-900 border border-gray-800 p-4 rounded-lg shadow-inner"></div>
            </div>
            <!-- Blue Agent Feed -->
            <div class="w-1/4 flex flex-col">
                <h2 class="text-center font-bold mb-3 text-blue-700 uppercase tracking-wider text-sm">Blue Agent</h2>
                <div id="blue-feed" class="feed bg-white border border-gray-300 p-4 rounded-lg shadow-inner"></div>
            </div>
        </div>
    </div>
    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
        const redFeed = document.getElementById('red-feed');
        const blueFeed = document.getElementById('blue-feed');
        const battleLog = document.getElementById('battle-log');
        const turnCount = document.getElementById('turn-count');
        const winnerText = document.getElementById('winner');

        ws.onmessage = (event) => {
            const update = JSON.parse(event.data);
            const { event_type, data } = update;

            if (event_type === 'turn_update') {
                turnCount.innerText = data.turn;
                if (data.winner) {
                    winnerText.innerText = data.winner.toUpperCase();
                    winnerText.classList.add('text-green-400');
                }
            } else if (event_type === 'agent_action') {
                const { role, content, type } = data;
                const div = document.createElement('div');
                div.className = `message ${role === 'red' ? 'red-msg' : 'blue-msg'}`;
                div.innerHTML = `<strong>${type === 'text' ? '💭 Thought' : '🛠️ Action'}:</strong><br>${content}`;
                if (role === 'red') redFeed.appendChild(div); else blueFeed.appendChild(div);
                redFeed.scrollTop = redFeed.scrollHeight;
                blueFeed.scrollTop = blueFeed.scrollHeight;
            } else if (event_type === 'battle_log') {
                const { tool, output } = data;
                const div = document.createElement('div');
                div.className = 'message log-msg';
                div.innerHTML = `<span class="text-gray-400"># ${tool}</span>\n${output}`;
                battleLog.appendChild(div);
                battleLog.scrollTop = battleLog.scrollHeight;
            }
        };

        ws.onclose = () => {
            console.log('WebSocket connection closed');
        };
    </script>
</body>
</html>
